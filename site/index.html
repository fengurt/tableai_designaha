<!doctype html>

<body class="hub-home">
  <header class="topbar">
    <a class="brand" href="./" data-i18n="hub.name">岁知社</a>

      <input id="brandSearch" type="search" autocomplete="off" aria-label="Search IP">
      <div class="global-results" id="globalResults" aria-live="polite"></div>

    <nav class="icon-nav" aria-label="Primary actions">
      <a class="nav-icon" href="api/manifest.json" aria-label="API manifest" title="API manifest" data-tip="API"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7V3"/><path d="M15 7V3"/><path d="M7 7h10v5a5 5 0 0 1-10 0V7Z"/><path d="M12 17v4"/><path d="M8.5 21h7"/></svg><span class="api-pulse"></span></a>
      <a class="nav-icon" href="#agent-entry" aria-label="我是 Agent" title="我是 Agent" data-tip="Agent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.75v2.5"/><rect x="5" y="7" width="14" height="10" rx="4"/><path d="M8.5 17.5 7 20"/><path d="M15.5 17.5 17 20"/><path d="M9 11.25h.01"/><path d="M15 11.25h.01"/><path d="M10 14h4"/></svg></a>
      <a class="nav-icon" href="#partner-entry" aria-label="我是合伙人" title="我是合伙人" data-tip="Partner"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 7.5a4 4 0 1 1-2.2 5.78L4 22l-2-2 8.72-9.3A4 4 0 0 1 15.5 7.5Z"/><path d="m14 14 2 2"/><path d="m17 11 2 2"/></svg></a>
      <a class="nav-icon" href="#collab-entry" aria-label="我想合作" title="我想合作" data-tip="Collab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v11H4z"/><path d="m4 7 8 6 8-6"/></svg></a>
      <button class="lang-toggle nav-icon" type="button" id="langToggle" aria-label="Switch language" title="Switch language" data-tip="Language"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.25 2.4 3.38 5.4 3.38 9S14.25 18.6 12 21"/><path d="M12 3C9.75 5.4 8.62 8.4 8.62 12S9.75 18.6 12 21"/></svg></button>
    </nav>
  </header>
  <main>
    <section class="hub-hero">
      <div class="hero-copy">
        <h1 data-i18n="hub.name">岁知社</h1>
        <p data-i18n="home.lead">高楼宾客似曾识，日光底下无新事。</p>
      </div>
      <div class="hero-index" id="heroIndex" aria-live="polite"></div>
    </section>
    <section class="entry-portals" aria-label="IPTrust entries">
      <article class="portal" id="agent-entry">
        <p class="eyebrow">Agent</p>
        <h3 data-i18n="portal.agentTitle">我是 Agent</h3>
        <p data-i18n="portal.agentBody">复制 Skill。</p>
        <button class="portal-action" type="button" data-portal-action="agent" data-portal-href="skills/iptrust-live-update/SKILL.md" data-i18n="portal.agentAction">Skill</button>
        <p class="portal-status" data-portal-status="agent" aria-live="polite"></p>
      </article>
      <article class="portal" id="partner-entry">
        <p class="eyebrow">Partner</p>
        <h3 data-i18n="portal.partnerTitle">我是合伙人</h3>
        <p data-i18n="portal.partnerBody">Key first.</p>
        <button class="portal-action" type="button" data-portal-action="partner" data-portal-href="admin.html" data-i18n="portal.partnerAction">Key first</button>
        <p class="portal-status" data-portal-status="partner" aria-live="polite"></p>
      </article>
      <article class="portal" id="collab-entry">
        <p class="eyebrow">Collab</p>
        <h3 data-i18n="portal.collabTitle">我想合作</h3>
        <p data-i18n="portal.collabBody">hi@tableai.ai</p>
        <button class="portal-action" type="button" data-portal-action="collab" data-portal-href="mailto:hi@tableai.ai" data-i18n="portal.collabAction">Email</button>
        <p class="portal-status" data-portal-status="collab" aria-live="polite"></p>
      </article>
    </section>
    <section class="section-head">
      <div>
        <h2 data-i18n="home.sectionTitle">IP</h2>
      </div>
      <span id="brandCount" class="count-pill"></span>
    </section>
    <section class="ip-grid" id="brandGrid" aria-live="polite"></section>
  </main>
  <script src="assets/site-0f2e2d9.js" type="module"></script>
