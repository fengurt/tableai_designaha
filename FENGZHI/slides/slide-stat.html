<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; width: 1280px; height: 720px; background: var(--surface-page); font-family: var(--font-body); display: flex; flex-direction: column; padding: 44px 64px; box-sizing: border-box; }
  .chrome { display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 0.22em; color: var(--stone); }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); margin-top: auto; }
  .col { background: var(--surface-page); padding: 28px 28px 6px 0; }
  .col + .col { padding-left: 28px; }
</style>
</head>
<body>
  <div class="chrome" style="border-bottom: 1px solid var(--line); padding-bottom: 18px;">
    <span>P6 · 商业模式与单位经济</span>
    <span>峰值永造局</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
    <div style="font-size: 15px; letter-spacing: 0.24em; color: var(--stone);">判断我们是科技公司，只看一条曲线</div>
    <div style="display: flex; align-items: baseline; gap: 32px; margin-top: 30px;">
      <span style="font-family: var(--font-western); font-weight: 300; font-size: 180px; line-height: 1; color: var(--ink); letter-spacing: -0.02em;">2<span style="color: var(--gold-deep);">→</span>6</span>
      <span style="font-family: var(--font-display); font-size: 28px; font-weight: 500; color: var(--ink);">管家人效<span style="display: block; font-family: var(--font-body); font-weight: 300; font-size: 16px; color: var(--ink-soft); margin-top: 10px;">每位管家每月交付的体验数 · 18 个月目标</span></span>
    </div>
  </div>
  <div class="cols">
    <div class="col"><div style="font-family: var(--font-western); font-weight: 300; font-size: 40px; color: var(--ink);">100</div><div style="font-size: 14px; color: var(--ink-soft); margin-top: 8px;">个家族账户即过亿收入</div><div style="font-size: 12px; color: var(--stone); margin-top: 4px;">账户数学 · 见附录 D</div></div>
    <div class="col"><div style="font-family: var(--font-western); font-weight: 300; font-size: 40px; color: var(--ink);">1,500 万</div><div style="font-size: 14px; color: var(--ink-soft); margin-top: 8px;">首期社群预收款（30 户 × 50 万）</div><div style="font-size: 12px; color: var(--stone); margin-top: 4px;">自造血 · 跑道延长近半年</div></div>
    <div class="col"><div style="font-family: var(--font-western); font-weight: 300; font-size: 40px; color: var(--ink);">6 万户</div><div style="font-size: 14px; color: var(--ink-soft); margin-top: 8px;">中国超高净值家庭</div><div style="font-size: 12px; color: var(--stone); margin-top: 4px;">McKinsey Greater China · 2025E</div></div>
  </div>
</body>
</html>
