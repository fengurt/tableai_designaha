<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; width: 1280px; height: 720px; background: var(--surface-page); font-family: var(--font-body); display: flex; flex-direction: column; padding: 44px 64px; box-sizing: border-box; }
  .chrome { display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 0.22em; color: var(--stone); border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  .stairs { display: flex; align-items: flex-end; gap: 10px; flex: 1; }
  .step { border: 1px solid var(--ink); display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; box-sizing: border-box; flex: 1; background: var(--surface-card); }
  .step .en { font-family: var(--font-western); font-size: 11px; letter-spacing: 0.14em; color: var(--stone); }
  .step .zh { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--ink); margin-top: 4px; }
  table { border-collapse: collapse; width: 380px; }
  td, th { border: 0.5px solid var(--line); font-size: 14px; padding: 9px 12px; text-align: left; font-weight: 400; color: var(--ink-soft); }
  th { font-family: var(--font-display); font-weight: 600; color: var(--ink); font-size: 14px; }
</style>
</head>
<body>
  <div class="chrome"><span>P4 · 品类与定位：转变经济</span><span>峰值永造局</span></div>
  <div style="font-family: var(--font-display); font-weight: 600; font-size: 32px; color: var(--ink); margin-top: 34px;">经济价值五层递进，止于转变</div>
  <div style="display: flex; gap: 56px; flex: 1; margin-top: 28px;">
    <div class="stairs">
      <div class="step" style="height: 24%;"><span class="en">COMMODITIES</span><span class="zh">商品</span></div>
      <div class="step" style="height: 41%;"><span class="en">GOODS</span><span class="zh">产品</span></div>
      <div class="step" style="height: 58%;"><span class="en">SERVICES</span><span class="zh">服务</span></div>
      <div class="step" style="height: 75%;"><span class="en">EXPERIENCES</span><span class="zh">体验</span></div>
      <div class="step" style="height: 94%; border-width: 1.5px;"><span class="en" style="color: var(--gold-deep);">TRANSFORMATIONS</span><span class="zh">转变</span><span style="font-size: 12px; color: var(--ink-soft); margin-top: 6px;">第五种、也是最后一种经济提供物</span></div>
    </div>
    <div style="display: flex; flex-direction: column; justify-content: flex-end; gap: 14px;">
      <table>
        <tr><th>Pine 四类愿望</th><th>峰值永造局 · 四界</th></tr>
        <tr><td>身心 Well-being</td><td>身体之界</td></tr>
        <tr><td>财富 Prosperity</td><td>他人之界</td></tr>
        <tr><td>智识 Wisdom</td><td>自我之界</td></tr>
        <tr><td>意义 Purpose</td><td>时间之界</td></tr>
      </table>
      <div style="font-size: 13px; color: var(--stone); line-height: 1.8;">两套独立演化的框架收敛于同一结构 · 收敛效度<br>Pine &amp; Gilmore 1997–2026 · 详见附录 A</div>
    </div>
  </div>
</body>
</html>
