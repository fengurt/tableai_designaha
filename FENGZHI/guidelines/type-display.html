<!-- @dsCard group="Type" viewport="700x210" subtitle="思源宋体 SemiBold · 大字距 — 标题与字标" name="标题字 · 宋" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 20px 22px; font-family: var(--font-body); }
  .spec { font-family: var(--font-display); color: var(--text-display); }
  .meta { font-family: var(--font-western); font-size: 10px; color: var(--text-caption); letter-spacing: 0.06em; margin-top: 4px; }
  .block { padding: 10px 0; border-bottom: var(--rule-hairline) solid var(--line); }
  .block:last-child { border-bottom: none; }
</style>
</head>
<body>
  <div class="block">
    <div class="spec" style="font-size: 34px; font-weight: 600; letter-spacing: var(--track-wordmark);">峰值永造局</div>
    <div class="meta">Wordmark · Noto Serif SC 600 · tracking 0.34em</div>
  </div>
  <div class="block">
    <div class="spec" style="font-size: 26px; font-weight: 600; letter-spacing: var(--track-display);">我们交付转变</div>
    <div class="meta">Display · 600 · tracking 0.08em · 一页一句话</div>
  </div>
  <div class="block">
    <div class="spec" style="font-size: 18px; font-weight: 500;">四界十一门 · 五旋钮 · 双重履约档案</div>
    <div class="meta">Subhead · 500</div>
  </div>
</body>
</html>
