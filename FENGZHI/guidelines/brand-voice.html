<!-- @dsCard group="Brand" viewport="700x260" subtitle="声音与语调 — 少而确定；以人开头；克制的承诺" name="声音与语调" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 18px 22px; font-family: var(--font-body); }
  .knife { font-family: var(--font-display); font-size: 16px; font-weight: 500; color: var(--ink); line-height: 1.8; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .no, .yes { padding: 10px 12px; font-size: 11px; line-height: 1.7; }
  .no { border: 1px solid var(--line); color: var(--stone); text-decoration: line-through; text-decoration-color: var(--line); }
  .yes { border: 1px solid var(--ink); color: var(--ink); font-family: var(--font-display); }
  .tag { font-family: var(--font-western); font-size: 8px; letter-spacing: 0.2em; display: block; margin-bottom: 5px; text-decoration: none; }
</style>
</head>
<body>
  <div class="knife">咨询公司交付报告，培训公司交付课时，旅行社交付行程——我们交付转变。</div>
  <div class="grid">
    <div class="no"><span class="tag" style="color: #B4452F;">✕ 不这样说</span>AI 赋能极致体验闭环，颠覆万亿市场！</div>
    <div class="yes"><span class="tag">✓ 这样说</span>第一阶段，一百个家族账户。</div>
  </div>
  <div style="font-size: 11px; color: var(--text-body); line-height: 1.9; margin-top: 12px;">
    三原则：<strong>少而确定</strong>（短句收尾，每个数字标注出处）· <strong>以人开头</strong>（先讲成为新的自己，AI 放第二句）· <strong>克制的承诺</strong>（写成可验证指标，不写愿景口号）。无感叹号，无 emoji，形容词每段至多一个。
  </div>
</body>
</html>
