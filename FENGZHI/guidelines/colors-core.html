<!-- @dsCard group="Colors" viewport="700x170" subtitle="纸白 · 墨黑 · 鎏金 · 石灰 — 方向 A 核心四色" name="核心色板" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-body); padding: 18px 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .chip { border: 1px solid rgba(0,0,0,0.08); height: 78px; }
  .name { font-size: 12px; color: var(--text-body); margin-top: 8px; font-weight: 500; }
  .val { font-size: 10px; font-family: var(--font-western); color: var(--text-caption); letter-spacing: 0.04em; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="chip" style="background: var(--paper);"></div><div class="name">纸白 --paper</div><div class="val">#FAF7F2</div></div>
    <div><div class="chip" style="background: var(--ink);"></div><div class="name">墨黑 --ink</div><div class="val">#1A1714</div></div>
    <div><div class="chip" style="background: var(--gold);"></div><div class="name">鎏金 --gold</div><div class="val">oklch(.66 .09 80)</div></div>
    <div><div class="chip" style="background: var(--stone);"></div><div class="name">石灰 --stone</div><div class="val">#8C857A</div></div>
  </div>
</body>
</html>
