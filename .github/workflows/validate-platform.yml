name: Validate IPTrust platform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npm run validate:assets
      - run: npm run validate:ip
      - run: npm run validate:fonts
      - run: npm run validate:routes
      - run: |
          node --check edge/src/index.js
          node --check edge/src/api.js
          node --check edge/src/ip.js
          node --check edge/src/jobs.js
          node --check edge/src/media.js
          node --check edge/src/mcp.js
          node --check edge/src/search.js
          node --check edge/src/security.js
          node --check site/_worker.js
      - run: npx wrangler deploy --dry-run --config edge/wrangler.toml
