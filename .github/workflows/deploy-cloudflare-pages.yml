name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Check Cloudflare configuration
        id: cloudflare
        shell: bash
        run: |
          project="${CLOUDFLARE_PAGES_PROJECT:-tableai-designaha}"
          echo "project=${project}" >> "$GITHUB_OUTPUT"
          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping Cloudflare Pages deploy."
          fi
      - name: Checkout
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Setup Node
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static site
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npm run build:site
      - name: Sync public library to D1
        if: steps.cloudflare.outputs.enabled == 'true'
        run: |
          npm run seed:library
          npx wrangler d1 migrations apply iptrust-library --remote
          npx wrangler d1 execute iptrust-library --remote --file .tmp/iptrust-library-seed.sql
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ steps.cloudflare.outputs.project }} --branch=main
