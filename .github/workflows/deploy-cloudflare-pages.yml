name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Check Cloudflare configuration
        id: cloudflare
        shell: bash
        run: |
          project="${CLOUDFLARE_PAGES_PROJECT:-tableai-designaha}"
          echo "project=${project}" >> "$GITHUB_OUTPUT"
          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping Cloudflare Pages deploy."
          fi
      - name: Checkout
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Setup Node
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npm ci
      - name: Build static site
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npm run build:site
      - name: Sync public library to D1
        if: steps.cloudflare.outputs.enabled == 'true'
        run: |
          npm run seed:library
          npx wrangler d1 migrations apply iptrust-library --remote --config edge/wrangler.toml
          npx wrangler d1 execute iptrust-library --remote --config edge/wrangler.toml --file .tmp/iptrust-library-seed.sql
      - name: Upload private research notes to R2
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          SUBANGYUAN_NOTE_B64: ${{ secrets.IPTRUST_SUBANGYUAN_NOTE_B64 }}
          YOUYUAN_JINGMENG_NOTE_B64: ${{ secrets.IPTRUST_YOUYUAN_JINGMENG_NOTE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/iptrust-private-notes"
          mkdir -p "$work"
          if [[ -n "${SUBANGYUAN_NOTE_B64:-}" ]]; then
            printf '%s' "$SUBANGYUAN_NOTE_B64" | base64 --decode > "$work/subangyuan.md"
            echo "03f8c85995bd2c298ca270a0c3f4c8e8adc07151ea940a2f3275cdf1439c2b1f  $work/subangyuan.md" | sha256sum --check --status
            npx wrangler r2 object put iptrust-media/private/subangyuan/notes/03f8c85995bd2c298ca270a0c3f4c8e8adc07151ea940a2f3275cdf1439c2b1f/source.md --remote --config edge/wrangler.toml --file "$work/subangyuan.md" --content-type text/markdown
          fi
          if [[ -n "${YOUYUAN_JINGMENG_NOTE_B64:-}" ]]; then
            printf '%s' "$YOUYUAN_JINGMENG_NOTE_B64" | base64 --decode > "$work/youyuan-jingmeng.md"
            echo "49acff2bb8ef69a8a691d41c454379f11b1c1aa742b117a06efa070bae6f84ac  $work/youyuan-jingmeng.md" | sha256sum --check --status
            npx wrangler r2 object put iptrust-media/private/youyuan-jingmeng/notes/49acff2bb8ef69a8a691d41c454379f11b1c1aa742b117a06efa070bae6f84ac/source.md --remote --config edge/wrangler.toml --file "$work/youyuan-jingmeng.md" --content-type text/markdown
          fi
          rm -rf "$work"
      - name: Import version-safe IP architecture snapshots
        if: steps.cloudflare.outputs.enabled == 'true'
        run: |
          npm run seed:platform -- --brands-only
          for seed in .tmp/platform-brand-seed-*.sql; do
            npx wrangler d1 execute iptrust-library --remote --config edge/wrangler.toml --file "$seed"
          done
      - name: Deploy edge API and media worker
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npx wrangler deploy --config edge/wrangler.toml
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ steps.cloudflare.outputs.project }} --branch=main
      - name: Verify production
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npm run check:production
